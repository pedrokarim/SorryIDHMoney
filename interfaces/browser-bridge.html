<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pont navigateur – SorryIDHMoney</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/browser-bridge.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="popup.html" class="icon-btn" title="Retour" aria-label="Retour"><i data-icon="arrow-left"></i></a>
      <div class="app-header-title">
        <h1>Pont navigateur</h1>
        <span class="subtitle">Journal des lectures faites par un outil local</span>
      </div>
      <a class="icon-btn" href="options.html" title="Réglages du pont" aria-label="Réglages du pont"><i data-icon="settings"></i></a>
    </header>

    <!-- État du pont : la première chose à regarder quand rien ne répond. -->
    <div class="card status">
      <span class="dot" id="bb-dot"></span>
      <div class="status-text">
        <strong id="bb-status-title">…</strong>
        <span id="bb-status-detail"></span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="bb-n-total">0</div>
        <div class="stat-label">Ordres</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="bb-n-sites">0</div>
        <div class="stat-label">Sites lus</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="bb-n-shots">0</div>
        <div class="stat-label">Captures</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="bb-n-failed">0</div>
        <div class="stat-label">Échecs</div>
      </div>
    </div>

    <section class="section">
      <div class="toolbar">
        <label class="visually-hidden" for="bb-filter">Filtrer par action</label>
        <select class="select" id="bb-filter">
          <option value="">Toutes les actions</option>
          <option value="read">Lecture</option>
          <option value="query">Éléments</option>
          <option value="screenshot">Capture</option>
          <option value="network">Réseau</option>
          <option value="inspect">Inspection</option>
          <option value="storage">Stockage</option>
          <option value="fetch">Requête</option>
          <option value="failed">Échecs seulement</option>
        </select>
        <label class="search">
          <i data-icon="search"></i>
          <span class="visually-hidden">Chercher dans l'historique</span>
          <input type="search" class="input" id="bb-search" placeholder="Site, adresse, sélecteur…" spellcheck="false">
        </label>
        <button type="button" class="btn btn-sm btn-danger" id="bb-clear" title="Vider l'historique"><i data-icon="trash" class="i-sm"></i><span class="label">Vider</span></button>
      </div>
      <div class="card rows" id="bb-list"></div>
      <div class="pager" id="bb-pager" hidden></div>
    </section>

    <p class="note">
      Le pont ne fait que lire. Ce journal garde ce qui a été demandé et ce que ça a rapporté,
      pas le contenu lui-même – sauf une vignette pour les captures.
    </p>
  </div>

  <script src="ui.js"></script>
  <script src="browser-bridge.js"></script>
</body>
</html>
