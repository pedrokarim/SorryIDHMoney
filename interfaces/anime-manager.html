<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire d'animes – SorryIDHMoney</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/anime-manager.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="popup.html" class="icon-btn" title="Retour" aria-label="Retour"><i data-icon="arrow-left"></i></a>
      <div class="app-header-title">
        <h1>Gestionnaire d'animes</h1>
        <span class="subtitle">Fiches corrigées à la main et animes ignorés</span>
      </div>
    </header>

    <div class="segmented" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="custom">Fiches corrigées <span class="tab-count" id="custom-count"></span></button>
      <button type="button" role="tab" aria-selected="false" data-tab="ignored">Ignorés <span class="tab-count" id="ignored-count"></span></button>
    </div>

    <label class="search">
      <i data-icon="search"></i>
      <span class="visually-hidden">Rechercher</span>
      <input type="search" class="input" id="search-input" placeholder="Rechercher un anime…" spellcheck="false">
    </label>

    <section id="custom-tab">
      <div class="card rows" id="custom-list"></div>
      <div class="pager" id="custom-pager" hidden></div>
    </section>

    <section id="ignored-tab" hidden>
      <div class="card rows" id="ignored-list"></div>
      <div class="pager" id="ignored-pager" hidden></div>
    </section>
  </div>

  <script src="ui.js"></script>
  <script type="module" src="anime-manager.js"></script>
</body>
</html>
