<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récompenses Twitch – SorryIDHMoney</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/twitch-stats.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="popup.html" class="icon-btn" title="Retour" aria-label="Retour"><i data-icon="arrow-left"></i></a>
      <div class="app-header-title">
        <h1>Récompenses Twitch</h1>
        <span class="subtitle" id="last-update">Jamais mis à jour</span>
      </div>
    </header>

    <div class="stats">
      <div class="stat accent">
        <div class="stat-value" id="points-collected">0</div>
        <div class="stat-label">Points récupérés</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="click-count">0</div>
        <div class="stat-label">Coffres ouverts</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="channel-total">0</div>
        <div class="stat-label">Chaînes</div>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <span class="section-title">Par chaîne</span>
        <span class="count" id="channel-count"></span>
      </div>
      <label class="search">
        <i data-icon="search"></i>
        <span class="visually-hidden">Rechercher une chaîne</span>
        <input type="search" class="input" id="search-input" placeholder="Rechercher une chaîne…" spellcheck="false">
      </label>
      <div class="card rows" id="channel-list"></div>
      <div class="pager" id="pager" hidden></div>
    </section>

    <div class="footer-actions">
      <span class="note" id="rewards-state"></span>
      <button type="button" class="btn btn-sm btn-danger" id="reset-stats"><i data-icon="trash" class="i-sm"></i><span class="label">Réinitialiser</span></button>
    </div>
  </div>

  <script src="ui.js"></script>
  <script src="twitch-stats.js"></script>
</body>
</html>
