<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publication X</title>
    <link rel="stylesheet" href="../styles/twitch-stats.css">
    <link rel="stylesheet" href="../styles/xposter.css">
</head>
<body>
    <div class="manager">
        <div class="manager-header">
            <a href="popup.html" class="back-btn" title="Retour">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            </a>
            <h1>Publication X</h1>
        </div>

        <!-- Etat du pont. Rouge tant qu'aucun echange recent : c'est la
             premiere chose a regarder quand rien ne part. -->
        <div class="xp-pont" id="xp-pont">
            <span class="xp-pastille" id="xp-pastille"></span>
            <div class="xp-pont-texte">
                <strong id="xp-pont-titre">…</strong>
                <span id="xp-pont-detail"></span>
            </div>
            <button class="xp-btn" id="xp-capturer" title="Capturer l'onglet X visible">Capturer l'écran</button>
        </div>

        <!-- Le cliche reste ici : ouvrir une image dans un onglet fait perdre
             de vue la file qu'on etait venu consulter. -->
        <figure class="xp-cliche" id="xp-cliche" hidden>
            <img id="xp-cliche-img" alt="Capture du composeur X">
            <figcaption>
                <span id="xp-cliche-quand"></span>
                <a id="xp-cliche-lien" href="#" target="_blank" rel="noreferrer">Ouvrir en grand</a>
                <button class="xp-btn" id="xp-cliche-fermer">Fermer</button>
            </figcaption>
        </figure>

        <div class="stats-summary">
            <div class="stat-box">
                <div class="stat-box-value" id="xp-n-attente">0</div>
                <div class="stat-box-label">En attente</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-value" id="xp-n-ok">0</div>
                <div class="stat-box-label">Abouties</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-value" id="xp-n-echec">0</div>
                <div class="stat-box-label">Échecs</div>
            </div>
        </div>

        <h2 class="xp-titre">Programmées</h2>
        <div id="xp-attente" class="xp-liste"></div>

        <h2 class="xp-titre">Historique</h2>
        <div id="xp-historique" class="xp-liste"></div>

        <p class="xp-note" id="xp-note"></p>
    </div>
    <script src="xposter.js"></script>
</body>
</html>
