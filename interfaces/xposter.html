<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publication X – SorryIDHMoney</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/xposter.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="popup.html" class="icon-btn" title="Retour" aria-label="Retour"><i data-icon="arrow-left"></i></a>
      <div class="app-header-title">
        <h1>Publication X</h1>
        <span class="subtitle">File d'attente et historique</span>
      </div>
      <a class="icon-btn" href="options.html" title="Réglages de la publication" aria-label="Réglages de la publication"><i data-icon="settings"></i></a>
    </header>

    <!-- État du pont. Rouge tant qu'aucun échange récent : c'est la première
         chose à regarder quand rien ne part. -->
    <div class="card status">
      <span class="dot" id="xp-dot"></span>
      <div class="status-text">
        <strong id="xp-bridge-title">…</strong>
        <span id="xp-bridge-detail"></span>
      </div>
      <button type="button" class="btn btn-sm" id="xp-capture" title="Photographier le composeur X"><i data-icon="camera" class="i-sm"></i><span class="label">Capturer</span></button>
    </div>

    <!-- Le cliché reste ici : l'ouvrir dans un onglet ferait perdre de vue la
         file qu'on était venu consulter. -->
    <figure class="card snapshot" id="xp-snapshot" hidden>
      <img id="xp-snapshot-img" alt="Capture du composeur X">
      <figcaption>
        <span id="xp-snapshot-time"></span>
        <a id="xp-snapshot-link" href="#" target="_blank" rel="noreferrer">Ouvrir en grand</a>
        <button type="button" class="icon-btn icon-btn-sm" id="xp-snapshot-close" title="Fermer" aria-label="Fermer la capture"><i data-icon="x" class="i-sm"></i></button>
      </figcaption>
    </figure>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="xp-n-waiting">0</div>
        <div class="stat-label">En attente</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="xp-n-ok">0</div>
        <div class="stat-label">Abouties</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="xp-n-failed">0</div>
        <div class="stat-label">Échecs</div>
      </div>
    </div>

    <section class="section">
      <div class="section-head"><span class="section-title">Programmées</span></div>
      <div class="card rows" id="xp-waiting"></div>
    </section>

    <section class="section">
      <div class="section-head"><span class="section-title">Historique</span></div>
      <div class="card rows" id="xp-history"></div>
    </section>

    <p class="note" id="xp-note"></p>
  </div>

  <script src="ui.js"></script>
  <script src="xposter.js"></script>
</body>
</html>
