<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testeur de toasts – SorryIDHMoney</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/toast-tester.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="options.html" class="icon-btn" title="Retour aux paramètres" aria-label="Retour aux paramètres"><i data-icon="arrow-left"></i></a>
      <div class="app-header-title">
        <h1>Testeur de toasts</h1>
        <span class="subtitle">Outil de développement</span>
      </div>
      <span class="badge gold">Dev</span>
    </header>

    <p class="note"><i data-icon="info" class="i-sm inline-icon"></i>Les toasts s'affichent sur l'onglet web actif, pas dans cette fenêtre.</p>

    <section class="section">
      <div class="section-head"><span class="section-title">Raccourcis</span></div>
      <div class="presets">
        <button type="button" class="card preset" data-type="success"><span class="dot ok"></span>Succès</button>
        <button type="button" class="card preset" data-type="error"><span class="dot err"></span>Erreur</button>
        <button type="button" class="card preset" data-type="warning"><span class="dot warn"></span>Attention</button>
        <button type="button" class="card preset" data-type="info"><span class="dot info"></span>Info</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><span class="section-title">Toast personnalisé</span></div>
      <div class="card rows">
        <div class="row stack">
          <label class="row-label" for="message">Message</label>
          <input type="text" class="input" id="message" value="Ceci est un test !">
        </div>
        <label class="row" for="type">
          <span class="row-text"><span class="row-label">Type</span></span>
          <select class="select" id="type">
            <option value="success">Succès</option>
            <option value="error">Erreur</option>
            <option value="warning">Attention</option>
            <option value="info" selected>Info</option>
          </select>
        </label>
        <label class="row" for="duration">
          <span class="row-text"><span class="row-label">Durée (ms)</span></span>
          <input type="number" class="input input-num" id="duration" value="3000" min="0" step="500">
        </label>
        <label class="row" for="position">
          <span class="row-text"><span class="row-label">Position</span></span>
          <select class="select" id="position">
            <option value="top-left">En haut à gauche</option>
            <option value="top-center">En haut au centre</option>
            <option value="top-right" selected>En haut à droite</option>
            <option value="bottom-left">En bas à gauche</option>
            <option value="bottom-center">En bas au centre</option>
            <option value="bottom-right">En bas à droite</option>
          </select>
        </label>
        <label class="row">
          <span class="row-text"><span class="row-label">Avec des boutons</span></span>
          <span class="switch"><input type="checkbox" id="with-buttons"><span class="track"></span></span>
        </label>
        <div class="row">
          <button type="button" class="btn btn-primary btn-block" id="custom-toast-btn"><i data-icon="send" class="i-sm"></i>Afficher le toast</button>
        </div>
      </div>
    </section>

    <p class="note warn" id="error-message" hidden></p>
  </div>

  <script src="ui.js"></script>
  <script src="toast-tester.js"></script>
</body>
</html>
